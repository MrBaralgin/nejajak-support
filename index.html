<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Поддержка Nejajak</title>
    <!-- Официальный скрипт Telegram Web App API для ПК и телефонов -->
    <script src="https://telegram.org"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #0b0e14;
        }
        .btn {
            padding: 18px 36px;
            background: linear-gradient(135deg, #ff007f, #00d2ff);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.4);
            text-decoration: none;
            display: inline-block;
            transition: transform 0.1s ease;
            text-align: center;
        }
        .btn:active {
            transform: scale(0.96);
        }
    </style>
</head>
<body>

    <!-- Железобетонный метод: используем внутренний протокол tg:// вместо https://t.me -->
    <!-- Это заставляет само приложение Telegram на ПК и телефоне мгновенно открыть чат -->
    <a href="tg://resolve?domain=nejajak_srv_1_bot" class="btn" id="linkBtn">Начать чат с поддержкой</a>

    <script>
        // Инициализируем WebApp на случай, если устройство поддерживает нативный метод
        const tg = window.Telegram.WebApp;
        if (tg) {
            tg.expand(); // Разворачиваем окно на максимум
        }

        document.getElementById('linkBtn').addEventListener('click', (e) => {
            // Если устройство поддерживает официальный API, дублируем команду через него
            try {
                tg.openTelegramLink("https://t.menejajak_srv_1_bot");
                setTimeout(() => { tg.close(); }, 300);
            } catch (err) {
                // Если API на ПК выдало ошибку, сработает стандартный переход по тегу <a> с протоколом tg://
                if (tg) { tg.close(); }
            }
        });
    </script>
</body>
</html>
