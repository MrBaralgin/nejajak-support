<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Поддержка Nejajak</title>
    <!-- ВАЖНО: Подключаем официальный скрипт Telegram Web App API -->
    <script src="https://telegram.org"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #0b0e14;
        }
        .btn {
            padding: 18px 36px;
            background: linear-gradient(135deg, #ff007f, #00d2ff);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.4);
            transition: transform 0.1s ease;
        }
        .btn:active {
            transform: scale(0.96);
        }
    </style>
</head>
<body>

    <button class="btn" id="startChat">Начать чат с поддержкой</button>

	<script>
		const tg = window.Telegram.WebApp;
		tg.expand();

		document.getElementById('startChat').addEventListener('click', () => {
			const botLink = "https://t.me/nejajak_srv_1_bot";

			try {
				// Метод для мобильных и корректных ПК-клиентов
				tg.openTelegramLink(botLink);
			} catch (e) {
				// Если ПК-версия выдала ошибку или проигнорировала метод — принудительный переход
				window.location.href = botLink;
			}

			// Закрываем окно Mini App чуть позже, чтобы переход успел сработать
			setTimeout(() => {
				tg.close();
			}, 300);
		});
	</script>
</body>
</html>
